# ============================================================
# tmux.conf — entry point only (tmux ≥ 3.1 reads this path).
# Edit the files in conf.d/; they are loaded in name order:
#   10-options.conf   terminal, mouse, indexes, nvim-friendly settings
#   20-keys.conf      shortcuts (mirrors kitty/keys.conf)
#   30-clipboard.conf copy-mode + clipboard (PC and Termux)
#   40-theme.conf     colours and status bar
# To add something, create e.g. conf.d/50-plugins.conf.
# ============================================================
source-file ~/.config/tmux/conf.d/*.conf
