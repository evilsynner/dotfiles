# ============================================================
# KEYS — mirrors ~/.config/kitty/keys.conf
#   No prefix:  C-h/j/k/l move   M-h/j/k/l resize
#               (sent to Neovim when it's in the pane; smart-splits
#                sets @pane-is-vim and comes back out at the edge).
#               Stops at the outer edge, same as move.at_edge in nvim.
#   Prefix:     C-a
# ============================================================

# ── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a → real C-a (line start / nested)
bind C-l send-keys C-l        # C-a C-l → clear screen (C-l is "move right")

# ── Move / resize (no prefix) ───────────────────────────────
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"

bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# ── Splits (prefix) — open in the current directory ─────────
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind x   kill-pane
# z (zoom), space (next layout), { } (swap), q (pane numbers)
# are tmux defaults and match kitty/keys.conf.

# ── Windows = kitty tabs (prefix) ───────────────────────────
bind c new-window -c "#{pane_current_path}"
bind X kill-window
# n / p / , / 1-9 are tmux defaults and match kitty/keys.conf.

# ── Misc (prefix) ───────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
