# ── Copy mode: prefix [  then v / V to select, y to copy ────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line

# OSC 52 lets tmux hand copies to the outer terminal (kitty) too.
set -g set-clipboard on

# Pick the system clipboard tool that exists on this machine:
# Termux → termux-clipboard-set (pkg install termux-api + Termux:API app)
# Wayland → wl-copy, X11 → xclip
if -b 'command -v termux-clipboard-set' \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'termux-clipboard-set'" \
    "if -b 'command -v wl-copy' \
        \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'\" \
        \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'\""
