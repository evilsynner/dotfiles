# ── Terminal / colours ──────────────────────────────────────
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"

# ── Neovim-friendly ─────────────────────────────────────────
set -sg escape-time 10      # Esc is instant in nvim
set  -g focus-events on     # nvim autoread / checktime works
set  -g history-limit 10000

# ── General ─────────────────────────────────────────────────
set  -g mouse on            # tap/drag to select panes on the phone too
set  -g base-index 1        # windows start at 1, like kitty tabs
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g allow-rename off
setw -g mode-keys vi

# Lets kitty know it's showing tmux (see shell/terminal.sh)
set  -g allow-passthrough on

# ── Bells off ───────────────────────────────────────────────
set  -g visual-activity off
set  -g visual-bell off
set  -g visual-silence off
setw -g monitor-activity off
set  -g bell-action none
