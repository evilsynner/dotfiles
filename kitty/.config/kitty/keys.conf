# ============================================================
# KEYS — mirrors ~/.config/tmux so the same fingers work on the
# PC (kitty) and the phone (Termux + tmux).
#
#   No prefix:  Ctrl-h/j/k/l move    Alt-h/j/k/l resize
#               (passed through to Neovim when it has focus;
#                smart-splits.nvim carries on into kitty at the edge)
#   Prefix:     Ctrl-a, then the key (same as tmux)
#
# kitty's own Ctrl+Shift defaults still work as a fallback.
# ============================================================

# ── Move / resize (no prefix) ───────────────────────────────
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

map alt+h kitten relative_resize.py left  3
map alt+j kitten relative_resize.py down  3
map alt+k kitten relative_resize.py up    3
map alt+l kitten relative_resize.py right 3

# Hand the keys to Neovim (smart-splits sets IS_NVIM) or to tmux
# running inside kitty (IN_TMUX is set by shell/terminal.sh).
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IN_TMUX ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IN_TMUX ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IN_TMUX ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l
map --when-focus-on var:IN_TMUX ctrl+l
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IN_TMUX alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IN_TMUX alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IN_TMUX alt+k
map --when-focus-on var:IS_NVIM alt+l
map --when-focus-on var:IN_TMUX alt+l

# Ctrl-l is "clear screen" in the shell → Ctrl-a Ctrl-l (like tmux)
map ctrl+a>ctrl+l send_text all \x0c
# Ctrl-a Ctrl-a sends a real Ctrl-a (line start / nested tmux)
map ctrl+a>ctrl+a send_text all \x01

# ── Splits (prefix) ─────────────────────────────────────────
map ctrl+a>backslash        launch --cwd=current --location=vsplit
map ctrl+a>shift+backslash  launch --cwd=current --location=vsplit
map ctrl+a>minus            launch --cwd=current --location=hsplit
map ctrl+a>x                close_window
map ctrl+a>z                toggle_layout stack
map ctrl+a>space            next_layout
map ctrl+a>shift+bracketleft  move_window_backward
map ctrl+a>shift+bracketright move_window_forward
map ctrl+a>q                focus_visible_window

# ── Tabs = tmux windows (prefix) ────────────────────────────
map ctrl+a>c      new_tab_with_cwd
map ctrl+a>n      next_tab
map ctrl+a>p      previous_tab
map ctrl+a>comma  set_tab_title
map ctrl+a>shift+x close_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# ── Misc (prefix) ───────────────────────────────────────────
map ctrl+a>bracketleft show_scrollback
map ctrl+a>r           load_config_file
map ctrl+a>shift+n     new_os_window_with_cwd
