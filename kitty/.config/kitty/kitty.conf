# ============================================================
# kitty.conf — entry point only. Edit the included files:
#   appearance.conf   fonts, cursor, tab bar, bells
#   keys.conf         all shortcuts (tmux-style Ctrl-a prefix)
#   current-theme.conf  theme (managed by `kitten themes`)
# Full option reference: https://sw.kovidgoyal.net/kitty/conf/
# ============================================================

include appearance.conf
include keys.conf

# Needed by smart-splits.nvim to move/resize across nvim ↔ kitty
allow_remote_control yes
listen_on unix:/tmp/mykitty

# BEGIN_KITTY_THEME
# Brogrammer
include current-theme.conf
# END_KITTY_THEME
